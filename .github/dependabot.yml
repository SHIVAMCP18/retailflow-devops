# Dependabot opens pull requests when a dependency or base image has an update.
version: 2
updates:
  - { package-ecosystem: npm,            directory: "/app", schedule: { interval: weekly } }
  - { package-ecosystem: docker,         directory: "/app", schedule: { interval: weekly } }
  - { package-ecosystem: github-actions, directory: "/",    schedule: { interval: weekly } }
