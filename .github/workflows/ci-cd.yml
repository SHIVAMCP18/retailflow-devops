# CI/CD pipeline
#   every push and pull request: 1 test -> 2 security scan -> 3 build + scan image -> 4 Kubernetes test
#   push to main also:           push the image to GitHub Container Registry -> 5 deploy to Render (cloud)
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/retailflow

jobs:
  test:
    name: 1. Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Install and run unit tests
        working-directory: app
        run: npm ci && npm test

  security:
    name: 2. Security scan (DevSecOps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Gitleaks - no passwords or keys committed to Git
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Trivy - vulnerable dependencies (fails on CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with: { scan-type: fs, severity: CRITICAL, ignore-unfixed: true, exit-code: "1" }
      - name: Trivy - misconfigurations in Dockerfile, Kubernetes and Terraform (report only)
        uses: aquasecurity/trivy-action@v0.36.0
        with: { scan-type: config, severity: "HIGH,CRITICAL", exit-code: "0" }

  build:
    name: 3. Build and scan the Docker image
    needs: [test, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Image name must be lowercase for GHCR
        run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"
      - name: Build the image
        run: docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" app
      - name: Trivy - scan the image (fails on CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with: { image-ref: "${{ env.IMAGE }}:${{ github.sha }}", severity: CRITICAL, ignore-unfixed: true, exit-code: "1" }
      - name: Push to GitHub Container Registry (main branch only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

  kubernetes:
    name: 4. Test on Kubernetes (kind)
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build -t ghcr.io/shivamcp18/retailflow:latest app
      - name: Create a temporary Kubernetes cluster
        uses: helm/kind-action@v1
        with: { cluster_name: retailflow }
      - name: Load the image into the cluster
        run: kind load docker-image ghcr.io/shivamcp18/retailflow:latest --name retailflow
      - name: Deploy with kubectl
        run: ./k8s/deploy.sh
      - name: Test the deployed app
        run: |
          kubectl -n retailflow port-forward svc/app 8080:8080 &
          sleep 5
          ./scripts/smoke.sh http://localhost:8080

  deploy:
    name: 5. Deploy to the cloud (Render)
    needs: [build, kubernetes]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
      API: https://api.render.com/v1
    steps:
      - uses: actions/checkout@v7
      - name: Skip if the cloud service is not set up yet
        id: check
        run: |
          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_SERVICE_ID" ]; then
            echo "::warning::RENDER_API_KEY / RENDER_SERVICE_ID secrets are not set, so deployment was skipped (see README)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy this exact commit and wait until it is live
        if: steps.check.outputs.ready == 'true'
        run: |
          auth=(-H "Authorization: Bearer $RENDER_API_KEY" -H "Content-Type: application/json")
          deploy=$(curl -fsS -X POST "${auth[@]}" "$API/services/$RENDER_SERVICE_ID/deploys" -d "{\"commitId\":\"$GITHUB_SHA\"}" | jq -r .id)
          echo "Started deploy $deploy for commit $GITHUB_SHA"
          for _ in $(seq 1 90); do
            status=$(curl -fsS "${auth[@]}" "$API/services/$RENDER_SERVICE_ID/deploys/$deploy" | jq -r .status)
            echo "status: $status"
            case "$status" in
              live) break ;;
              *failed|canceled|deactivated) echo "::error::Deploy ended with status $status"; exit 1 ;;
            esac
            sleep 10
          done
          [ "$status" = live ] || { echo "::error::Deploy did not finish in 15 minutes"; exit 1; }
      - name: Check the live website
        if: steps.check.outputs.ready == 'true'
        run: |
          url=$(curl -fsS -H "Authorization: Bearer $RENDER_API_KEY" "$API/services/$RENDER_SERVICE_ID" | jq -r .serviceDetails.url)
          ./scripts/smoke.sh "$url"
          echo "### Live at $url" >> "$GITHUB_STEP_SUMMARY"
