# Runs the whole project:   docker compose up --build   then open http://localhost:8080
name: retailflow

services:
  app:
    image: ${IMAGE:-ghcr.io/shivamcp18/retailflow}:${TAG:-latest}
    build: ./app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/retailflow
      APP_VERSION: ${TAG:-latest}
    depends_on:
      db: { condition: service_healthy }

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: retailflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: ["db-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 20

  proxy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [app]

volumes:
  db-data:
  caddy-data:
