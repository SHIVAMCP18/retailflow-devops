# The RetailFlow app: 2 replicas behind one Service. Refresh the page and the
# footer shows which pod answered.
apiVersion: apps/v1
kind: Deployment
metadata: { name: app, namespace: retailflow }
spec:
  replicas: 2
  selector: { matchLabels: { app: retailflow } }
  template:
    metadata: { labels: { app: retailflow } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 1000 }
      containers:
        - name: app
          image: ghcr.io/shivamcp18/retailflow:latest
          imagePullPolicy: IfNotPresent
          env:
            - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: retailflow-secret, key: POSTGRES_PASSWORD } } }
            - { name: DATABASE_URL, value: "postgresql://postgres:$(POSTGRES_PASSWORD)@db:5432/retailflow" }
            - { name: APP_VERSION, value: "kubernetes" }
          ports: [{ containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /health, port: 8080 }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /health, port: 8080 }, initialDelaySeconds: 20, periodSeconds: 10 }
          resources: { requests: { memory: 48Mi, cpu: 50m }, limits: { memory: 128Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true }
---
# LoadBalancer: on Docker Desktop this opens http://localhost:8080
apiVersion: v1
kind: Service
metadata: { name: app, namespace: retailflow }
spec:
  type: LoadBalancer
  selector: { app: retailflow }
  ports: [{ port: 8080, targetPort: 8080 }]
